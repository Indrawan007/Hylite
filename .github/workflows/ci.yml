name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux build, lint, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check tools/source-core-tests.rs
      - name: Test and lint independent Source core
        run: RUSTC="$(rustup which clippy-driver)" ./scripts/test-source-core.sh
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build application
        run: cargo build --locked --all-targets --all-features
      - name: Run tests without a display server
        run: cargo test --locked --all-targets --all-features
