name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux build, lint, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            xvfb xauth xdotool xclip imagemagick fonts-dejavu-core libxkbcommon-x11-0 python3-xlib
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-runtime-v1
          cache-on-failure: true
      - name: Test CI and GUI diagnostic helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check tools/source-core-tests.rs
      - name: Test and lint independent Source core
        run: ./scripts/ci-cargo.sh env RUSTC="$(rustup which clippy-driver)" ./scripts/test-source-core.sh
      - name: Lint all targets
        run: ./scripts/ci-cargo.sh cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build application
        run: ./scripts/ci-cargo.sh cargo build --locked --all-targets --all-features
      - name: Run tests without a display server
        run: ./scripts/ci-cargo.sh cargo test --locked --all-targets --all-features
      - name: Smoke test actual GUI on isolated X11
        timeout-minutes: 10
        run: |
          set +e
          ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --artifacts "$RUNNER_TEMP/hylite-gui-smoke" 2>&1 | tee "$RUNNER_TEMP/gui-smoke.log"
          exit "${PIPESTATUS[0]}"
      - name: Report GUI smoke diagnostics
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/gui-smoke.log" ]; then
            body=$(tail -n 40 "$RUNNER_TEMP/gui-smoke.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=GUI smoke tail::$body"
            ls -la "$RUNNER_TEMP/hylite-gui-smoke" || true
          fi
      - name: Smoke test task batches on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite task-batch --artifacts "$RUNNER_TEMP/hylite-gui-smoke/task-batch"
      - name: Smoke test table alignment on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite table-alignment --artifacts "$RUNNER_TEMP/hylite-gui-smoke/table-alignment"
      - name: Smoke test table rows on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite table-rows --artifacts "$RUNNER_TEMP/hylite-gui-smoke/table-rows"
      - name: Smoke test table cell drafts on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite table-cells --artifacts "$RUNNER_TEMP/hylite-gui-smoke/table-cells"
      - name: Smoke test cell navigation on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite cell-navigation --artifacts "$RUNNER_TEMP/hylite-gui-smoke/cell-navigation"
      - name: Smoke test explicit blank table rows on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite table-insert --artifacts "$RUNNER_TEMP/hylite-gui-smoke/table-insert"
      - name: Smoke test blank table columns on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite table-columns --artifacts "$RUNNER_TEMP/hylite-gui-smoke/table-columns"
      - name: Smoke test table column deletion on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite table-column-delete --artifacts "$RUNNER_TEMP/hylite-gui-smoke/table-column-delete"
      - name: Smoke test body-row moves on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite table-row-move --artifacts "$RUNNER_TEMP/hylite-gui-smoke/table-row-move"
      - name: Smoke test column moves on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite table-column-move --artifacts "$RUNNER_TEMP/hylite-gui-smoke/table-column-move"
      - name: Smoke test column duplication on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite table-column-duplicate --artifacts "$RUNNER_TEMP/hylite-gui-smoke/table-column-duplicate"
      - name: Smoke test Apply and Previous on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite cell-apply-previous --artifacts "$RUNNER_TEMP/hylite-gui-smoke/cell-apply-previous"
      - name: Smoke test root paragraph drafts on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite paragraph-draft --artifacts "$RUNNER_TEMP/hylite-gui-smoke/paragraph-draft"
      - name: Smoke test multiline paragraph drafts on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite paragraph-multiline --artifacts "$RUNNER_TEMP/hylite-gui-smoke/paragraph-multiline"
      - name: Smoke test local paragraph draft history on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite paragraph-draft-history --artifacts "$RUNNER_TEMP/hylite-gui-smoke/paragraph-draft-history"
      - name: Smoke test multiline paragraph navigation on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite paragraph-navigation --artifacts "$RUNNER_TEMP/hylite-gui-smoke/paragraph-navigation"
      - name: Smoke test multiline Apply and Next on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite paragraph-apply-next --artifacts "$RUNNER_TEMP/hylite-gui-smoke/paragraph-apply-next"
      - name: Smoke test multiline Apply and Previous on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite paragraph-apply-previous --artifacts "$RUNNER_TEMP/hylite-gui-smoke/paragraph-apply-previous"
      - name: Smoke test multiline draft commit shortcuts on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite paragraph-draft-shortcuts --artifacts "$RUNNER_TEMP/hylite-gui-smoke/paragraph-draft-shortcuts"
      - name: Smoke test single paragraph navigation on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite paragraph-navigation-single --artifacts "$RUNNER_TEMP/hylite-gui-smoke/paragraph-navigation-single"
      - name: Smoke test single-line draft history on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite draft-history-single --artifacts "$RUNNER_TEMP/hylite-gui-smoke/draft-history-single"
      - name: Smoke test draft history keyboard shortcuts on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite draft-history-keys --artifacts "$RUNNER_TEMP/hylite-gui-smoke/draft-history-keys"
      - name: Smoke test multi-buffer tabs on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite tabs --artifacts "$RUNNER_TEMP/hylite-gui-smoke/tabs"
      - name: Smoke test the workspace folder tree on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite workspace --artifacts "$RUNNER_TEMP/hylite-gui-smoke/workspace"
      - name: Smoke test read-only preview images on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite images --artifacts "$RUNNER_TEMP/hylite-gui-smoke/images"
      - name: Smoke test headless PDF export on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite pdf --artifacts "$RUNNER_TEMP/hylite-gui-smoke/pdf"
      - name: Smoke test the read-only math subset on a separate isolated X11 display
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite math --artifacts "$RUNNER_TEMP/hylite-gui-smoke/math"
      - name: Smoke test the opt-in Stage 9a inline caret spike
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite inline-spike --artifacts "$RUNNER_TEMP/hylite-gui-smoke/inline-spike"
      - name: Probe Stage 9b mouse hit-testing and selection diagnostics
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite inline-probe --artifacts "$RUNNER_TEMP/hylite-gui-smoke/inline-probe"
      - name: Probe the read-only alternative advanced widget
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh ./scripts/test-gui-x11.sh --suite inline-alt-probe --artifacts "$RUNNER_TEMP/hylite-gui-smoke/inline-alt-probe"
      - name: Measure Stage 10b raw editor timings
        timeout-minutes: 5
        run: ./scripts/ci-cargo.sh cargo test --locked --bin hylite --all-features performance_benchmarks::stage10b_baseline -- --ignored --exact --nocapture
      - name: Upload GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-x11-smoke
          path: ${{ runner.temp }}/hylite-gui-smoke/
          if-no-files-found: ignore
          retention-days: 7
