[package]
name = "hylite"
version = "0.1.0"
edition = "2021"
description = "A fast, native Markdown editor for Arch + Hyprland"
license = "MIT"

[dependencies]
iced = { version = "0.13", features = ["tokio", "svg", "image", "advanced"] }
pulldown-cmark = { version = "0.12", features = ["simd"] }
rfd = "0.15"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
