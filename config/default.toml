# Missing fields and sections use these defaults.
[editor]
# Use an installed font family, e.g. "JetBrains Mono Nerd Font", or "monospace".
font_family = "monospace"
font_size = 16.0
# Tab inserts spaces up to the next stop; pasted literal tabs are preserved.
tab_size = 4
# `auto_save` is reserved: the key is accepted so old configs still load, but
# autosave is not implemented and the value is never written back here.
word_wrap = true
# Read-only lexical Markdown colors; false restores plain Source text.
syntax_highlighting = true
# Bare Enter continues simple lists; Shift+Enter always uses native newline.
auto_continue_lists = true
default_mode = "source"

[appearance]
theme = "catppuccin-mocha"
content_width = 820
sidebar_width = 220
# Window opacity is controlled by Hyprland, not by this configuration.
